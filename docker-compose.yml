services:
  node-server:
    image: node:lts-alpine
    container_name: node-server
    # restart: always        # I produktion: startar alltid om automatiskt om servern kraschar eller rebootas
    restart: "no"            # I utbildning: startar INTE containern automatiskt när eleven startar datorn
    working_dir: /app
    volumes:
      - ./www:/app:z
    ports:
      - "${PORT:-80}:3000"
    env_file:
      - path: .env
        required: false
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mariadb
    environment:
      - TZ=Europe/Stockholm
    networks:
      - app-network

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    # restart: always        # I produktion: databasen ska alltid starta automatiskt vid systemstart
    restart: "no"            # I utbildning: startar inte vid datorstart för att spara batteri/resurser
    volumes:
      - ./db:/var/lib/mysql:z
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-12345}
      MYSQL_DATABASE: ${DB_NAME:-webbserver_db}
      TZ: Europe/Stockholm
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma
    # restart: always        # I produktion
    restart: "no"            # I utbildning
    environment:
      PMA_HOST: mariadb
      TZ: Europe/Stockholm
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      - mariadb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
