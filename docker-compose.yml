services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./www:/app
    ports:
      - "${PORT:-80}:3000"
    env_file:
      - path: .env
        required: false
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
    environment:
      - TZ=Europe/Stockholm

  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-12345}
      MARIADB_DATABASE: ${DB_NAME:-webbserver_db}
      TZ: Europe/Stockholm
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-12345}
      TZ: Europe/Stockholm
    depends_on:
      - db

volumes:
  db_data:
